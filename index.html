<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071019">
  <title>Dual Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="timer-card blue" aria-label="横のタイマー">
      <div class="title-row"><span></span><h1>横</h1><span></span></div>

      <div class="previous-row">
        <div class="previous-box">
          <div class="label">前回</div>
          <div class="previous-content">
            <strong id="horizontalPrevious">00.00</strong>
            <button id="horizontalLock" class="icon-button" aria-label="前回の時間をロック" title="ロック切替">🔓</button>
          </div>
        </div>
        <button id="horizontalReset" class="secondary-button">↻&nbsp; リセット</button>
      </div>

      <div id="horizontalDisplay" class="display">00.00</div>
      <button id="horizontalStart" class="start-button">▶&nbsp; 開始 / 停止</button>
    </section>

    <section class="timer-card green" aria-label="奥のタイマー">
      <div class="title-row"><span></span><h1>奥</h1><span></span></div>

      <div class="previous-row">
        <div class="previous-box">
          <div class="label">前回</div>
          <div class="previous-content">
            <strong id="depthPrevious">00.00</strong>
            <button id="depthLock" class="icon-button" aria-label="前回の時間をロック" title="ロック切替">🔓</button>
          </div>
        </div>
        <button id="depthReset" class="secondary-button">↻&nbsp; リセット</button>
      </div>

      <div id="depthDisplay" class="display">00.00</div>
      <button id="depthStart" class="start-button">▶&nbsp; 開始 / 停止</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
